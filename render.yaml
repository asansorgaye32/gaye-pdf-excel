services:
  - type: web
    name: mmo-royalcert-excel-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_API_TOKEN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
